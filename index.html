<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hugo Ceni · Designer de UX/UI, marcas e jogos</title>

<meta property="og:url" content="https://hugo-ceni.github.io/">
<meta property="og:title" content="Hugo Ceni · Designer de UX/UI, marcas e jogos">
<meta property="og:description" content="Design que facilita e diverte. Interfaces, marcas e jogos, com pesquisa, processo e resultado.">

<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@400;600;800&family=Funnel+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* ByDkHappy · paleta Azulejo do Catete. Três formas, três trilhas: quadrado = UX, círculo = Design, triângulo = Games. */
:root{
  --paper:#F3EEE4; --surface:#FBF8F2; --ink:#16161A; --muted:#5E5A52; --line:#D8CFBF; --line-strong:#16161A;
  --ux:#2347D8; --ux-ink:#2347D8; --ux-tint:#DFE5FA;
  --design:#E0552B; --design-ink:#B23F18; --design-tint:#F8DDD2;
  --games:#1E8A5E; --games-ink:#17704C; --games-tint:#D5ECDF;
  --accent:var(--ink); --accent-ink:var(--ink); --accent-tint:#E6DFD2;
  --display:"Funnel Display", "Arial Black", Arial, sans-serif;
  --body:"Funnel Sans", "Segoe UI", Arial, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#131418; --surface:#1B1C21; --ink:#F1ECE2; --muted:#A9A397; --line:#2F3038; --line-strong:#F1ECE2;
    --ux:#7C95FF; --ux-ink:#9CAEFF; --ux-tint:#1D2547; --design:#FF7A4D; --design-ink:#FF9670; --design-tint:#3A2018;
    --games:#45C690; --games-ink:#66D6A6; --games-tint:#132E23; --accent-tint:#24252B; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#131418; --surface:#1B1C21; --ink:#F1ECE2; --muted:#A9A397; --line:#2F3038; --line-strong:#F1ECE2;
  --ux:#7C95FF; --ux-ink:#9CAEFF; --ux-tint:#1D2547; --design:#FF7A4D; --design-ink:#FF9670; --design-tint:#3A2018;
  --games:#45C690; --games-ink:#66D6A6; --games-tint:#132E23; --accent-tint:#24252B; color-scheme:dark;
}
body[data-track="ux"]{--accent:var(--ux);--accent-ink:var(--ux-ink);--accent-tint:var(--ux-tint)}
body[data-track="design"]{--accent:var(--design);--accent-ink:var(--design-ink);--accent-tint:var(--design-tint)}
body[data-track="games"]{--accent:var(--games);--accent-ink:var(--games-ink);--accent-tint:var(--games-tint)}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--paper)}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.02;font-weight:800;letter-spacing:-.02em}
p,li,dd{text-wrap:pretty}
.wrap{max-width:1180px;margin:0 auto}
.mono{font-family:var(--mono)}
.label{font:500 12px/1.4 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.shape{display:inline-block;width:.72em;height:.72em;flex:0 0 auto}
.sq{background:var(--ux)} .ci{background:var(--design);border-radius:50%} .tr{background:var(--games);clip-path:polygon(50% 0,100% 100%,0 100%)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:var(--paper);border-bottom:2px solid var(--line-strong)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap;padding-block:14px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none}
.seal{display:flex;gap:3px;font-size:18px}
.brand b{font:800 20px/1 var(--display);letter-spacing:-.02em}
.brand small{font:500 11px var(--mono);letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{display:flex;align-items:center;gap:8px;font:600 14px/1 var(--body);text-decoration:none;padding:10px 12px;border:1.5px solid transparent}
.tab .shape{font-size:14px}
.tab:hover{border-color:var(--line)}
.tab[aria-current="page"]{border-color:var(--ink)}
.tabs{margin-left:auto}
.lang{display:flex;border:1.5px solid var(--ink)}
.lang button{font:500 12px/1 var(--mono);letter-spacing:.06em;padding:9px 10px;background:transparent;color:var(--ink);border:0;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.lang button:focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px}
.ctrl{display:flex;gap:8px;align-items:center}
.theme{display:inline-grid;place-items:center;width:34px;height:34px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer;padding:0}
.theme svg{width:16px;height:16px}
.theme:focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px}
@media (max-width:720px){.ctrl{order:2;margin-left:auto}.tabs{order:3;width:100%;margin-left:0}}

main{padding-block:48px 80px}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:48px;align-items:center;padding-bottom:56px;border-bottom:2px solid var(--line-strong)}
.hero h1{font-size:clamp(46px,7.4vw,96px);margin:14px 0 22px}
.hero h1 .ln{display:block;white-space:nowrap}
.hero h1 .shape{font-size:.5em;vertical-align:.12em;margin-left:.08em}
.hero p{font-size:19px;color:var(--muted);max-width:52ch;margin:0}
.hero .why{display:flex;gap:16px;align-items:center;margin-top:26px;max-width:600px}
.hero .why img{width:120px;height:120px;object-fit:cover;flex:0 0 auto;border-radius:50%;border:2px solid var(--line-strong)}
.hero .why p{font-size:15px;margin:0}
.hero .why .label{display:block;margin-bottom:4px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);border:2px solid var(--line-strong);max-width:100%;aspect-ratio:1}
.tile{all:unset;cursor:pointer;aspect-ratio:1;position:relative;border:1px solid var(--line);transition:transform .35s cubic-bezier(.3,1.4,.5,1)}
.tile svg{width:100%;height:100%;display:block}
.tile:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
.tiles-cap{margin-top:10px;display:flex;justify-content:space-between;gap:12px}
.rows{display:grid}
.row{display:grid;grid-template-columns:72px minmax(0,1fr) minmax(0,1.2fr) 40px;gap:24px;align-items:center;padding:28px 0;border-bottom:1px solid var(--line);text-decoration:none}
.row:hover h2{color:var(--rc)}
.row .n{font:500 14px var(--mono);color:var(--muted)}
.row h2{display:flex;align-items:center;gap:14px;font-size:clamp(30px,4vw,48px);transition:color .2s}
.row h2 .shape{font-size:.6em}
.row p{margin:0;color:var(--muted)}
.row .arrow{font:600 24px var(--display);color:var(--rc);transition:transform .2s}
.row:hover .arrow{transform:translateX(6px)}
.row[data-p="ux"]{--rc:var(--ux-ink)} .row[data-p="design"]{--rc:var(--design-ink)} .row[data-p="games"]{--rc:var(--games-ink)}

/* track */
.thero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:32px;align-items:end;padding-bottom:36px;border-bottom:2px solid var(--line-strong)}
.thero h1{font-size:clamp(38px,6vw,76px);margin:12px 0 18px}
.thero h1 em{font-style:normal;color:var(--accent-ink)}
.thero p{margin:0;font-size:18px;color:var(--muted);max-width:60ch}
.big{width:clamp(90px,14vw,180px);height:clamp(90px,14vw,180px);background:var(--accent)}
body[data-track="design"] .big{border-radius:50%}
body[data-track="games"] .big{clip-path:polygon(50% 0,100% 100%,0 100%)}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.fact{font:500 13px var(--mono);padding:6px 10px;border:1.5px solid var(--ink)}
.list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 28px}
.list.small{grid-template-columns:repeat(4,minmax(0,1fr))}
.list.small h3{font-size:24px}
.item{display:grid;gap:14px;align-content:start;padding:32px 0;border-bottom:1px solid var(--line);text-decoration:none;min-width:0}
.item .media{position:relative;aspect-ratio:1;overflow:hidden;background:var(--accent-tint);max-width:100%;border:1.5px solid var(--ink)}
.vtag{position:absolute;z-index:1;left:10px;top:10px;font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;background:var(--paper);border:1.5px solid var(--ink)}
.item img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s ease}
.item:hover img{transform:scale(1.03)}
.item .meta{display:flex;justify-content:space-between;gap:12px;font:500 13px var(--mono);color:var(--muted)}
.item .meta b{color:var(--accent-ink);font-weight:500}
.item h3{font-size:28px}
.item:hover h3{color:var(--accent-ink)}
.item p{margin:0;color:var(--muted)}
.sub{display:flex;align-items:center;gap:12px;margin:56px 0 4px}
.sub h2{font-size:24px}
.sub::after{content:"";flex:1;height:2px;background:var(--line-strong)}
.note{margin-top:20px;padding:20px 22px;border:1.5px dashed var(--muted);color:var(--muted);max-width:760px}
.note strong{color:var(--ink)}

/* case */
.back{display:inline-flex;gap:8px;align-items:center;font:600 14px var(--body);text-decoration:none;color:var(--muted);margin-bottom:28px}
.back:hover{color:var(--ink)}
.chead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end;padding-bottom:28px}
.chead h1{font-size:clamp(42px,7vw,88px);margin:10px 0 12px}
.chead p{margin:0;font-size:20px;color:var(--muted);max-width:50ch}
.chead .num{font:800 clamp(56px,9vw,120px)/.8 var(--display);color:var(--accent);letter-spacing:-.04em}
.himg{border:2px solid var(--line-strong);background:var(--surface)}
.himg img{display:block;width:100%;max-height:640px;object-fit:contain}
.cbody{display:grid;grid-template-columns:minmax(0,270px) minmax(0,1fr);gap:56px;margin-top:44px;align-items:start}
.ficha{position:sticky;top:calc(env(safe-area-inset-top, 0px) + 92px);border-top:4px solid var(--accent);padding-top:16px;display:grid;gap:16px}
.ficha dl{margin:0;display:grid;gap:14px}
.ficha dd{margin:3px 0 0;font-size:15px;line-height:1.45}
.ficha .links{display:grid;gap:10px;align-content:start;padding-top:14px;border-top:1px solid var(--line)}
.ficha .links a{font:600 15px var(--body);color:var(--accent-ink);text-decoration:none}
.ficha .links a:hover{text-decoration:underline}
.story{display:grid;gap:48px;min-width:0}
.story section{display:grid;gap:14px}
.story h2{font-size:30px;display:flex;align-items:center;gap:12px}
.story h2 .shape{font-size:.5em}
.story p{margin:0;font-size:18px;max-width:64ch}
.steps{list-style:none;margin:0;padding:0;display:grid;counter-reset:s;border-top:1px solid var(--line)}
.steps li{display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;padding:18px 0;border-bottom:1px solid var(--line)}
.steps li::before{counter-increment:s;content:counter(s, decimal-leading-zero);font:500 14px/1.7 var(--mono);color:var(--accent-ink)}
.steps strong{display:block;font-size:18px;font-family:var(--display);font-weight:600}
.steps span{display:block;color:var(--muted);max-width:62ch}
.stepimgs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:12px}
.stepimgs img{width:100%;display:block;border:1.5px solid var(--ink);background:var(--surface)}
.tbl{display:grid;gap:8px;margin-top:6px}
.tblwrap{overflow-x:auto;border:2px solid var(--line-strong)}
.tbl table{border-collapse:collapse;width:100%;min-width:520px;font-size:14.5px}
.tbl th{font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;text-align:left;padding:10px 12px;background:var(--accent-tint);border-bottom:1.5px solid var(--ink)}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.45}
.tbl tr:last-child td{border-bottom:0}
.trail{margin-top:72px;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:48px}
.trail h2{font-size:clamp(28px,3.6vw,40px);margin:6px 0 18px}
.tl{list-style:none;margin:0;padding:0;border-top:2px solid var(--line-strong)}
.tl li{display:grid;grid-template-columns:120px minmax(0,1fr);gap:16px;padding:16px 0;border-bottom:1px solid var(--line)}
.tl .when{font:500 13px/1.5 var(--mono);color:var(--muted)}
.tl strong{display:block;font:600 18px/1.3 var(--display)}
.tl span{display:block;color:var(--muted);font-size:15px}
.side{display:grid;gap:24px;align-content:start}
.side .label{display:block;margin-bottom:8px}
.side p{margin:0;font-size:15px}
.side p a{color:var(--ink);text-decoration-color:var(--design);text-underline-offset:3px}
.tools{display:flex;flex-wrap:wrap;gap:6px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));border:2px solid var(--line-strong)}
.stat{padding:18px 20px;border-right:1px solid var(--line);display:grid;gap:4px}
.stat:last-child{border-right:0}
.stat b{font:800 34px/1.05 var(--display);letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--accent-ink)}
.stat span{font-size:14px;color:var(--muted)}
.resumo{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:2px solid var(--line-strong);border-top:0}
.resumo div{padding:16px 20px;border-right:1px solid var(--line);min-width:0}
.resumo div:last-child{border-right:0}
.resumo p{margin:6px 0 0;font-size:16px;line-height:1.45}
.nota{margin:0;padding:18px 22px;background:var(--accent-tint);border-left:4px solid var(--accent);border-radius:0;max-width:64ch}
.nota p{margin:6px 0 0;font:600 21px/1.4 var(--display);letter-spacing:-.01em}
.vid{margin:0;display:grid;gap:8px}
.vid video{width:100%;display:block;border:2px solid var(--line-strong);background:#000;aspect-ratio:16/9}
.vid figcaption{font:400 13px var(--mono);color:var(--muted)}
.vids{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:20px;align-items:start}
.vid.v{max-width:360px}
.vid.v video{aspect-ratio:9/16;max-height:640px;object-fit:contain}
@media (max-width:720px){.vids{grid-template-columns:minmax(0,1fr)}}
.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.gallery figure{margin:0;display:grid;gap:8px;align-content:start;min-width:0}
.gallery img{width:100%;display:block;border:1.5px solid var(--ink);background:var(--accent-tint)}
.gallery figcaption{font:400 13px var(--mono);color:var(--muted)}
.next{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:64px;padding-top:22px;border-top:2px solid var(--line-strong)}
.next a{display:grid;gap:4px;text-decoration:none}
.next a:last-child{text-align:right}
.next b{font:800 26px var(--display);letter-spacing:-.02em}
.next a:hover b{color:var(--accent-ink)}

/* contact */
.contact{margin-top:80px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end;padding-top:28px;border-top:2px solid var(--line-strong)}
.contact h2{font-size:clamp(32px,4.4vw,52px);margin-top:6px}
.contact p{margin:10px 0 0;color:var(--muted)}
.mascot{display:inline-grid;place-items:center;width:58px;height:58px;background:#111427;margin-bottom:14px}
.mascot svg{width:44px;height:44px}
.xp{margin-top:72px}
.xp .intro{max-width:62ch;color:var(--muted);margin:8px 0 0}
.xp h2{font:800 clamp(28px,3.6vw,40px)/1.05 var(--display);margin:6px 0 0;letter-spacing:-.01em}
.contact .act{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:flex-end}
.email{font:500 15px var(--mono);user-select:all;padding:10px 12px;background:var(--surface);border:1.5px solid var(--ink)}
#play{display:inline-block;margin-top:14px}
.btn{font:600 14px var(--body);padding:10px 14px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);text-decoration:none;cursor:pointer}
.btn:hover{background:var(--ink);color:var(--paper)}
footer{padding-block:24px 32px}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font:400 13px var(--mono);color:var(--muted)}

@media (max-width:880px){
  .hero,.thero,.chead,.contact{grid-template-columns:minmax(0,1fr)}
  .hero{gap:32px}
  .tiles{max-width:360px}
  .row{grid-template-columns:44px minmax(0,1fr) 28px;gap:6px 12px}
  .row p{grid-column:2 / 3}
  .row .arrow{grid-row:1;grid-column:3}
  .list,.list.small{grid-template-columns:repeat(2,minmax(0,1fr));gap:0 16px}
  .item h3,.list.small h3{font-size:20px}
  .item p{font-size:14px}
  .gallery,.resumo,.trail{grid-template-columns:minmax(0,1fr)}
  .tl li{grid-template-columns:minmax(0,1fr);gap:4px}
  .resumo div{border-right:0;border-bottom:1px solid var(--line)}
  .cbody{grid-template-columns:minmax(0,1fr);gap:32px}
  .ficha{position:static}
  .chead .num,.big{display:none}
  .contact .act{justify-content:flex-start}
  .stat{border-right:0;border-bottom:1px solid var(--line)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<style>html,body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>

<script>try{var t=localStorage.getItem('theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<header class="top">
  <div class="wrap">
    <a class="brand" href="#inicio" aria-label="Hugo Ceni, ByDkHappy, início">
      <span class="seal" aria-hidden="true"><i class="shape sq"></i><i class="shape ci"></i><i class="shape tr"></i></span>
      <span><b>Hugo Ceni</b><br><small>ByDkHappy</small></span>
    </a>
    <nav class="tabs" aria-label="Trilhas do portfólio">
      <a class="tab" href="#ux" data-tab="ux"><i class="shape sq" aria-hidden="true"></i>UX/UI</a>
      <a class="tab" href="#design" data-tab="design"><i class="shape ci" aria-hidden="true"></i><span class="tl-txt">Design e Social</span></a>
      <a class="tab" href="#games" data-tab="games"><i class="shape tr" aria-hidden="true"></i>Games</a>
    </nav>
    <div class="ctrl"><div class="lang" role="group" aria-label="Idioma"><button type="button" data-lang="pt" aria-pressed="true">PT</button><button type="button" data-lang="en" aria-pressed="false">EN</button></div><button class="theme" id="theme" type="button" aria-label="Modo escuro"></button></div>
  </div>
</header>

<main class="wrap" id="app"></main>

<footer><div class="wrap"><span>Hugo Ferreira Ceni de Almeida · Rio de Janeiro</span><span id="sig">ByDkHappy · Design que facilita e diverte</span></div></footer>

<script>
const P = 'https://hugoceni.myportfolio.com/';
const SHAPE = {ux:'sq', design:'ci', games:'tr'};

const TRACKS_PT = {
  ux: {
    n:'01', name:'UX/UI',
    title:'Apps que eu <em>pesquisei, prototipei e testei</em> com gente de verdade.',
    line:'Pesquisa, modelagem de interação, protótipo e teste com usuários.',
    intro:'Sou designer de UX/UI formado pela PUC-Rio e estou concluindo a pós em UX e Interação Humano-Computador. Pesquiso, modelo a interação, prototipo no Figma e valido com quem vai usar.',

function mergeL(a, b){
  if (b === undefined || b === null) return a;
  if (typeof b === 'string') return b;
  if (Array.isArray(a)) return a.map((v, i) => mergeL(v, Array.isArray(b) ? b[i] : undefined));
  if (a && typeof a === 'object') { const o = {...a}; for (const k in b) o[k] = mergeL(a[k], b[k]); return o; }
  return b;
}

const ROT = [0,1,2,1, 0,2,3,0, 1,3,0,2, 3,0,1,2];
function tilesHTML(){
  return LAYOUT.map((k,i) => `<button class="tile" type="button" aria-label="${U.tileAria} ${i+1}" data-r="${ROT[i]}" style="transform:rotate(${ROT[i]*90}deg)"><svg viewBox="0 0 100 100" aria-hidden="true">${TILE_KINDS[k]}</svg></button>`).join('');
}

function home(){
  document.body.dataset.track = '';
  app.innerHTML = `
    <section class="hero">
      <div>
        <span class="label">Designer · Rio de Janeiro · ByDkHappy</span>
        <h1><span class="ln">${U.h1[0]} ${sh('ux')}</span><span class="ln">${U.h1[1]} ${sh('design')}</span><span class="ln">${U.h1[2]} ${sh('games')}</span></h1>
        <p>${U.heroP}</p>
        <div class="why"><img src="img/hugo.webp" alt="${U.photoAlt}"><p><span class="label">${U.whyLabel}</span> ${U.whyText}</p></div>
      </div>
      <div>
        <div class="tiles" id="tiles">${tilesHTML()}</div>
        <div class="tiles-cap label"><span>${U.tilesCap}</span><span>${U.tilesClick}</span></div>
      </div>
    </section>
    <div class="rows">
      ${['ux','design','games'].map(k => `
        <a class="row" data-p="${k}" href="#${k}">
          <span class="n">${TRACKS[k].n}</span>
          <h2>${sh(k)}${esc(TRACKS[k].name)}</h2>
          <p>${esc(TRACKS[k].line)} <span class="mono">${pad(listOf(TRACKS[k]).length)} ${U.projects}</span></p>
          <span class="arrow" aria-hidden="true">→</span>
        </a>`).join('')}
    </div>
    <section class="xp" aria-label="${U.xpLabel}">
      <span class="label">${U.xpLabel}</span>
      <h2>${U.xpTitle}</h2>
      <p class="intro">${U.xpText}</p>
      <div class="list">${['quiz32','maresea','colmeia'].map((id, i) => cardHTML(id, i+1)).join('')}</div>
    </section>
    <section class="trail" aria-label="${U.trailAria}">
      <div>
        <span class="label">${U.trailLabel}</span>
        <h2>${U.trailTitle}</h2>
        <ol class="tl">
          ${U.tl.map(r => `<li><span class="when">${r[0]}</span><div><strong>${r[1]}</strong><span>${r[2]}</span></div></li>`).join('')}
        </ol>
      </div>
      <div class="side">
        <div><span class="label">${U.eduLabel}</span>${U.edu.map(e => `<p>${e}</p>`).join('')}</div>
        <div><span class="label">${U.toolsLabel}</span><div class="tools">${U.tools.map(t => `<span class="fact">${t}</span>`).join('')}</div></div>
        <div><span class="label">${U.moveLabel}</span><p>${U.moveText}</p></div>
        <div><span class="label">${U.offLabel}</span><p>${U.offText}</p></div>
        <div><span class="label">${U.langLabel}</span><p>${U.langs}</p></div>
      </div>
    </section>
    ${contact()}`;
  document.getElementById('tiles').addEventListener('click', e => {
    const t = e.target.closest('.tile'); if (!t) return;
    const r = +t.dataset.r + 1; t.dataset.r = r; t.style.transform = `rotate(${r*90}deg)`;
  });
}

function cardHTML(id, n){
  const c = CASES[id];
  const year = (c.ficha.find(f => ['Ano','Período','Year','Period'].includes(f[0])) || ['', c.ficha[0][1]])[1];
  return `<a class="item" href="#${id}">
    <div class="media">${(c.video || c.videos) ? `<span class="vtag">${U.video}</span>` : ''}<img src="${c.thumb || c.img}" alt="${esc(c.alt)}" loading="lazy" style="object-position:${c.pos || '50% 50%'}"></div>
    <div class="meta"><b>${pad(n)}</b><span>${esc(year)}</span></div>
    <h3>${esc(c.title)}</h3><p>${esc(c.kicker)}</p>
  </a>`;
}

function track(k){
  const t = TRACKS[k];
  document.body.dataset.track = k;
  const items = t.cases.map((id, i) => cardHTML(id, i+1)).join('');
  const extras = t.extra ? `<div class="sub"><h2>${t.extra.label}</h2></div><div class="list small">${t.extra.cases.map((id, i) => cardHTML(id, t.cases.length+i+1)).join('')}</div>` : '';
  const proativa = k==='design' ? `<div class="sub"><h2>${U.secretH}</h2></div><p class="note">${U.secretNote}</p>` : '';
  app.innerHTML = `
    <section class="thero">
      <div>
        <span class="label">${U.trackLabel} ${t.n} / 03 · ${esc(t.name)}</span>
        <h1>${t.title}</h1>
        <p>${esc(t.intro)}</p>
        <div class="facts">${t.facts.map(f => `<span class="fact">${esc(f)}</span>`).join('')}</div>
      </div>
      <div class="big" aria-hidden="true"></div>
    </section>
    <div class="list">${items}</div>
    ${extras}
    ${proativa}
    ${contact()}`;
}

function kase(id){
  const c = CASES[id], t = TRACKS[c.track];
  document.body.dataset.track = c.track;
  const list = listOf(t), i = list.indexOf(id);
  const prev = list[(i - 1 + list.length) % list.length], next = list[(i + 1) % list.length];
  const L = t.labels;
  const sec = (title, inner) => inner ? `<section><h2>${sh(c.track)}${title}</h2>${inner}</section>` : '';
  const resumo = c.resumo ? `<div class="resumo" aria-label="${U.resumoAria}">
      ${[[L[0], c.resumo[0]],[U.did, c.resumo[1]],[U.result, c.resumo[2]]].map(r => `<div><span class="label">${esc(r[0])}</span><p>${esc(r[1])}</p></div>`).join('')}
    </div>` : '';
  const vfig = (v, poster) => `<figure class="vid${v[3] ? ' v' : ''}"><video controls preload="metadata" playsinline poster="${poster}"><source src="${v[0]}" type="video/mp4"></video><figcaption>${esc(v[1])}</figcaption></figure>`;
  const video = c.video ? `<section><h2>${sh(c.track)}${U.watch}</h2>${vfig(c.video, 'img/poster_'+id+'.webp')}</section>`
    : c.videos ? `<section><h2>${sh(c.track)}${U.watch}</h2><div class="vids">${c.videos.map(v => vfig(v, v[2])).join('')}</div></section>` : '';
  const nota = c.nota ? `<blockquote class="nota"><span class="label">${U.nota}</span><p>${esc(c.nota)}</p></blockquote>` : '';
  app.innerHTML = `
    <a class="back" href="#${c.track}">${U.back} ${esc(t.name)}</a>
    <header class="chead">
      <div><span class="label">${esc(t.name)} · ${esc(c.ficha[0][1])}</span><h1>${esc(c.title)}</h1><p>${esc(c.kicker)}</p></div>
      <span class="num" aria-hidden="true">${pad(i+1)}</span>
    </header>
    <div class="himg"><img src="${c.img}" alt="${esc(c.alt)}"></div>
    ${resumo}
    <div class="cbody">
      <aside class="ficha" aria-label="${U.fichaAria}">
        <span class="label">${U.ficha}</span>
        <dl>${c.ficha.slice(1).map(f => `<div><dt class="label">${esc(f[0])}</dt><dd>${esc(f[1])}</dd></div>`).join('')}</dl>
        ${c.play ? `<a class="btn" id="play" href="${c.play}" ${ext} hidden>${U.play} ↗</a>` : ''}
        ${c.links ? `<div class="links"><span class="label">${U.deeper}</span>${c.links.map(l => `<a href="${l[1]}" ${ext}>${esc(l[0])} ↗</a>`).join('')}</div>` : ''}
      </aside>
      <div class="story">
        ${sec(L[0], `<p>${esc(c.problema)}</p>`)}
        ${nota}
        ${sec(L[1], `<ol class="steps">${c.processo.map(s => `<li><div><strong>${esc(s[0])}</strong><span>${esc(s[1])}</span>${s[2] ? `<div class="stepimgs">${[].concat(s[2]).map(src => `<img src="${src}" alt="${esc(s[0])}" loading="lazy">`).join('')}</div>` : ''}</div></li>`).join('')}</ol>`)}
        ${sec(L[2], c.validacao ? `<p>${esc(c.validacao)}</p>` + (c.tabelas || []).map(t => `<div class="tbl"><span class="label">${esc(t.title)}</span><div class="tblwrap"><table><thead><tr>${t.head.map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${t.rows.map(r => `<tr>${r.map(x => `<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`).join('') : '')}
        ${sec(L[3], (c.metrics ? `<div class="stats">${c.metrics.map(m => `<div class="stat"><b>${esc(m[0])}</b><span>${esc(m[1])}</span></div>`).join('')}</div>` : '') + (c.resultado ? `<p>${esc(c.resultado)}</p>` : ''))}
        ${video}
        ${c.gallery ? `<div class="gallery">${c.gallery.map(g => `<figure><img src="${g[0]}" alt="${esc(g[1])}" loading="lazy"><figcaption>${esc(g[1])}</figcaption></figure>`).join('')}</div>` : ''}
      </div>
    </div>
    <nav class="next" aria-label="${U.nextAria}">
      <a href="#${prev}"><span class="label">${U.prev}</span><b>${esc(CASES[prev].title)}</b></a>
      <a href="#${next}"><span class="label">${U.next}</span><b>${esc(CASES[next].title)}</b></a>
    </nav>
    ${contact()}`;
}

function checkPlay(){
  const b = document.getElementById('play'); if (!b) return;
  fetch(b.getAttribute('href'), {method:'HEAD'}).then(r => { if (r.ok) b.hidden = false; }).catch(() => {});
}

function route(){
  const h = location.hash.slice(1);
  if (TRACKS[h]) track(h); else if (CASES[h]) { kase(h); checkPlay(); } else home();
  document.querySelectorAll('.tab').forEach(a => {
    if (document.body.dataset.track === a.dataset.tab) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current');
  });
  window.scrollTo(0, 0);
}

app.addEventListener('click', e => {
  if (e.target.id !== 'copy') return;
  const btn = e.target, email = document.getElementById('email');
  const done = () => { btn.textContent = U.copied; setTimeout(() => btn.textContent = U.copy, 2000); };
  const fallback = () => { const r = document.createRange(); r.selectNodeContents(email); const s = getSelection(); s.removeAllRanges(); s.addRange(r); btn.textContent = U.selected; };
  try { navigator.clipboard.writeText('hgceni@gmail.com').then(done, fallback); } catch (err) { fallback(); }
});

document.querySelector('.lang').addEventListener('click', e => {
  const b = e.target.closest('button[data-lang]'); if (!b || b.dataset.lang === LANG) return;
  LANG = b.dataset.lang; try { localStorage.setItem('lang', LANG); } catch (err) {}
  const y = window.scrollY; applyLang(); route(); window.scrollTo(0, y);
});

const MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>';
const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>';
const darkMQ = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : null;
function isDark(){ const t = document.documentElement.getAttribute('data-theme'); return t ? t === 'dark' : !!(darkMQ && darkMQ.matches); }
function paintTheme(){
  const b = document.getElementById('theme'); if (!b) return;
  const d = isDark(); b.innerHTML = d ? SUN : MOON; b.setAttribute('aria-label', d ? U.toLight : U.toDark); b.title = b.getAttribute('aria-label');
  const m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute('content', d ? '#131418' : '#F3EEE4');
}
document.getElementById('theme').addEventListener('click', () => {
  const next = isDark() ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('theme', next); } catch (e) {}
  paintTheme();
});
if (darkMQ && darkMQ.addEventListener) darkMQ.addEventListener('change', paintTheme);

window.addEventListener('hashchange', route);
applyLang();
route();
</script>
</body>
</html>
